name: lint
on: [pull_request, push, workflow_dispatch]
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
jobs:
  lint:
    env:
      FORCE_COLOR: 1
      PREK_COLOR: always
      UV_FROZEN: 1
      UV_NO_SYNC: 1
      UV_PYTHON_PREFERENCE: only-managed
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install Python dependencies
        run: uv sync
      - name: Cache prek hooks
        id: cache-prek-hooks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/prek
          key: prek|${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: prek|
      - name: Run gitlint
        run: uv run prek run --hook-stage manual gitlint-ci
      - name: Run prek
        run: uv run prek run --all-files --show-diff-on-failure
      - name: Prune prek hooks
        if: steps.cache-prek-hooks.outputs.cache-hit != 'true'
        run: uv run prek cache gc
